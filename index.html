<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Manager</title>
</head>
<body>

<div class="container">

    <header class="header">
        <div>
            <h1>Smart Expense Manager</h1>
            <p>Manage your expenses efficiently and effectively.</p>
        </div>
        <span class="user-badge">My Dashboard</span>
    </header>

    <!--Summary Section-->

    <section class="summary">
        <div class="card">
            <p>Total Balance</p>
            <h2 id="balance">₹0.00</h2>
        </div>

        <div class="card income-card">
            <p>Total Income</p>
            <h2 id="income">₹0.00</h2>
        </div>

        <div class="card expense-card">
            <p>Total Expenses</p>
            <h2 id="expense">₹0.00</h2>
        </div>

    </section>

    <!--Add Transaction -->

    <section class="panel">
        <h2>Add New Transaction</h2>

        <form id="transaction-form">
            <div class="form-group">
                <label for="description">Description</label>
                <input 
                    type="text" 
                    id="description" 
                    placeholder="eg. Monthly Salary " 
                    required
                >
            </div>

            <div class="form-group">
                <label for="amount">Amount(₹)</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="Enter Amount"
                    min="0.01"
                    step="0.01"
                    required
                >

            </div>

            <div class="form-group">
                <label for="type">Transaction Type</label>
                <select id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>
            
            <button type="submit">+Add Transaction</button>

        </form>
    </section>

    <!--Transaction History-->

    <section class="panel">

        <h2>Recent Transaction</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="transaction-list">
                    <tr>
                        <td colspand="4" class="empty-message">
                            No transactions yet. Add a transaction to get started!
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>
    </section>

    <script src="script.js"></script>

</body>
</html>
